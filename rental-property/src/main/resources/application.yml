server:
  port: 8082

spring:
  application:
    name: rental-property
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        namespace: public
      config:
        server-addr: 127.0.0.1:8848
        namespace: public
        file-extension: yaml
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 0
  datasource:
    driver-class-name: dm.jdbc.driver.DmDriver
    url: jdbc:dm://localhost:5236/RENTAL?schema=RENTAL_PROPERTY&zeroDateTimeBehavior=convertToNull&useUnicode=true&characterEncoding=utf-8
    username: SYSDBA
    password: SYSDBA001

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.rental.property.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deletedAt

knife4j:
  enable: true
  setting:
    language: zh_cn
  openapi:
    title: 房源服务API
    description: 租房小程序房源服务接口文档
    version: 1.0.0

logging:
  level:
    com.rental.property: DEBUG
