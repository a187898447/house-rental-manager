server:
  port: 8081

spring:
  application:
    name: rental-user
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        namespace: public
      config:
        server-addr: 127.0.0.1:8848
        namespace: public
        file-extension: yaml
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 0
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/rental_db?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: rental123456

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.rental.user.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deletedAt
      logic-delete-value: now()
      logic-not-delete-value: "0"

knife4j:
  enable: true
  setting:
    language: zh_cn
  openapi:
    title: 用户服务API
    description: 租房小程序用户服务接口文档
    version: 1.0.0
    contact:
      name: backend-dev

logging:
  level:
    com.rental.user: DEBUG

# 微信配置
wechat:
  appid: wx1234567890abcdef
  secret: abcdef1234567890abcdef1234567890
