services:
  # MySQL 数据库
  mysql:
    image: mysql:8.0
    container_name: rental-mysql
    environment:
      - MYSQL_ROOT_PASSWORD=rental123456
      - MYSQL_DATABASE=rental_db
      - MYSQL_CHARACTER_SET_SERVER=utf8mb4
      - MYSQL_COLLATION_SERVER=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - rental-network

  # Nacos 服务注册/配置中心
  nacos:
    image: nacos/nacos-server:v2.2.3-slim
    container_name: rental-nacos
    environment:
      - MODE=standalone
    ports:
      - "8848:8848"
      - "9848:9848"
    depends_on:
      - mysql
    networks:
      - rental-network

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: rental-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - rental-network

  # API 网关
  rental-gateway:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.gateway
    container_name: rental-gateway
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    ports:
      - "8080:8080"
    depends_on:
      - nacos
      - redis
    networks:
      - rental-network

  # 用户服务
  rental-user:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.user
    container_name: rental-user
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    ports:
      - "8081:8081"
    depends_on:
      - nacos
      - redis
      - mysql
    networks:
      - rental-network

  # 房源服务
  rental-property:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.property
    container_name: rental-property
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    ports:
      - "8082:8082"
    depends_on:
      - nacos
      - redis
      - mysql
    networks:
      - rental-network

  # 账单服务
  rental-bill:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.bill
    container_name: rental-bill
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    ports:
      - "8083:8083"
    depends_on:
      - nacos
      - redis
      - mysql
    networks:
      - rental-network

  # 通知服务
  rental-notify:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.notify
    container_name: rental-notify
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    ports:
      - "8084:8084"
    depends_on:
      - nacos
      - redis
    networks:
      - rental-network

  # 支付服务（预留）
  rental-pay:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.pay
    container_name: rental-pay
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    ports:
      - "8085:8085"
    depends_on:
      - nacos
      - redis
    networks:
      - rental-network

networks:
  rental-network:
    driver: bridge

volumes:
  mysql-data:
  redis-data:
