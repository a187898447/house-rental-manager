server:
  port: 8083

spring:
  application:
    name: rental-bill
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        namespace: public
      config:
        server-addr: 127.0.0.1:8848
        namespace: public
        file-extension: yaml
  datasource:
    driver-class-name: dm.jdbc.driver.DmDriver
    url: jdbc:dm://localhost:5236/RENTAL?schema=RENTAL_BILL&zeroDateTimeBehavior=convertToNull
    username: SYSDBA
    password: SYSDBA001

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.rental.bill.entity
  configuration:
    map-underscore-to-camel-case: true

knife4j:
  enable: true
  openapi:
    title: 账单服务API
    version: 1.0.0
